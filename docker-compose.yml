services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: itaca
      POSTGRES_USER: itaca
      POSTGRES_PASSWORD: itaca
    ports:
      # Host port 5433 (container stays 5432) to avoid clashing with another local Postgres.
      # Override with ITACA_DB_PORT if needed.
      - "${ITACA_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itaca -d itaca"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itaca
      SPRING_DATASOURCE_USERNAME: itaca
      SPRING_DATASOURCE_PASSWORD: itaca
      ITACA_API_TOKEN: ${ITACA_API_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
