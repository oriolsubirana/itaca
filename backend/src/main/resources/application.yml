spring:
  application:
    name: itaca
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/itaca}
    username: ${SPRING_DATASOURCE_USERNAME:itaca}
    password: ${SPRING_DATASOURCE_PASSWORD:itaca}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  session:
    # HTTP sessions live in Postgres (survive redeploys) and last a week, so the login holds for ~7
    # days — matching Google's Testing-mode token, so a weekly re-auth refreshes everything at once.
    timeout: 7d
    jdbc:
      # The SPRING_SESSION tables are created by Liquibase (migration 101), not by Spring Session.
      initialize-schema: never
  ai:
    anthropic:
      # Placeholder default keeps the context bootable without a key (calls will fail with 401)
      api-key: ${ANTHROPIC_API_KEY:missing-api-key}
      chat:
        model: claude-sonnet-4-6
        max-tokens: 2048
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true

# Google sign-in (browser/PWA) is wired in code by GoogleClientRegistration, which only
# builds a ClientRegistrationRepository when GOOGLE_CLIENT_ID is set. Declaring it here with
# empty env defaults would fail Boot's registration validation, so it is intentionally absent:
# local/test runs without the env vars keep the API open and skip Google login entirely.

jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: false

springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs/swagger

management:
  endpoints:
    web:
      exposure:
        include: health,info

itaca:
  # Where the SPA lives; Google login redirects back here after a successful sign-in.
  app-url: ${ITACA_APP_URL:http://localhost:5173}
  security:
    # Static bearer token for machine callers (Garmin Action, iOS Shortcut, Strava sync).
    # Empty = no auth (development only): the API stays open and Google login is bypassed.
    token: ${ITACA_API_TOKEN:}
    # Single-user allowlist: only this Google account may sign in. REQUIRED when Google login
    # is configured — fail-closed: an empty value rejects every account (nobody can log in).
    allowed-email: ${ITACA_ALLOWED_EMAIL:}
  finance:
    # Counterparty names (own/partner/joint) whose movements are transfers, not spending.
    transfer-names: ${ITACA_FINANCE_TRANSFER_NAMES:}
  storage:
    # Local fallback when Supabase is not configured. Holds all ingested documents
    # (lab reports and finance statements), not just labs.
    local-dir: ${ITACA_STORAGE_DIR:./data/documents}
  extraction:
    model: claude-haiku-4-5
  strava:
    # Garmin -> Strava bridge: register an app at strava.com/settings/api.
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    # Single-user shortcut: a refresh token obtained once by hand seeds the account
    # on first sync, so prod can skip the OAuth web flow (no callback domain needed).
    refresh-token: ${STRAVA_REFRESH_TOKEN:}
    redirect-uri: ${STRAVA_REDIRECT_URI:http://localhost:8080/api/strava/callback}
    app-url: ${ITACA_APP_URL:http://localhost:5173}
    # Overridable so tests can point the OAuth/API calls at a stub.
    auth-base: ${STRAVA_AUTH_BASE:https://www.strava.com}
    api-base: ${STRAVA_API_BASE:https://www.strava.com/api/v3}

# Supabase storage activates itself when the SUPABASE_URL env var is set
# (relaxed binding maps it to supabase.url); otherwise local files are used.

server:
  port: 8080
  servlet:
    session:
      cookie:
        # Persist the cookie for a week so the login survives the PWA being closed/evicted (otherwise
        # it's a session cookie and dies on app restart). Prod adds secure/http-only/same-site.
        max-age: 7d
