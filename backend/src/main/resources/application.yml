spring:
  application:
    name: itaca
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/itaca}
    username: ${SPRING_DATASOURCE_USERNAME:itaca}
    password: ${SPRING_DATASOURCE_PASSWORD:itaca}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  ai:
    anthropic:
      # Placeholder default keeps the context bootable without a key (calls will fail with 401)
      api-key: ${ANTHROPIC_API_KEY:missing-api-key}
      chat:
        model: claude-sonnet-4-6
        max-tokens: 2048
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true

jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: false

springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs/swagger

management:
  endpoints:
    web:
      exposure:
        include: health,info

itaca:
  security:
    # Static bearer token for the whole API. Empty = no auth (development only).
    token: ${ITACA_API_TOKEN:}
  storage:
    # Local fallback when Supabase is not configured
    local-dir: ${ITACA_STORAGE_DIR:./data/lab-reports}
  extraction:
    model: claude-haiku-4-5
  strava:
    # Garmin -> Strava bridge: register an app at strava.com/settings/api.
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    redirect-uri: ${STRAVA_REDIRECT_URI:http://localhost:8080/api/strava/callback}
    app-url: ${ITACA_APP_URL:http://localhost:5173}
    # Overridable so tests can point the OAuth/API calls at a stub.
    auth-base: ${STRAVA_AUTH_BASE:https://www.strava.com}
    api-base: ${STRAVA_API_BASE:https://www.strava.com/api/v3}

# Supabase storage activates itself when the SUPABASE_URL env var is set
# (relaxed binding maps it to supabase.url); otherwise local files are used.

server:
  port: 8080
