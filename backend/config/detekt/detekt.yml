# Detekt overrides on top of the default config (buildUponDefaultConfig = true)

style:
  MagicNumber:
    # Domain invariants like `value in 1..7` (Bristol) read better inline
    ignoreRanges: true
    ignoreCompanionObjectPropertyDeclaration: true
  ReturnCount:
    # Chat tools return early with structured error results (guard-clause style)
    max: 5

complexity:
  TooManyFunctions:
    # The public surface is the metric; private helpers don't count
    ignorePrivate: true
  LongParameterList:
    # JPA entity constructors mirror table columns; @Tool signatures mirror
    # the JSON schema the model fills in
    ignoreAnnotated:
      - "jakarta.persistence.Entity"
      - "org.springframework.ai.tool.annotation.Tool"
