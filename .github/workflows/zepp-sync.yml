name: Zepp scale sync

# Daily pull of the Xiaomi scale's body composition (via the Zepp cloud) into Ítaca.
# Needs repo secrets: ZEPP_EMAIL, ZEPP_PASSWORD, ITACA_URL, ITACA_API_TOKEN.
# The login is huami-token's encrypted app flow (one login per run). If Zepp ever
# starts rate-limiting datacenter IPs like Garmin did, copy garmin-sync.yml's
# token-cache + seed-secret dance.
on:
  schedule:
    - cron: "45 6 * * *" # 06:45 UTC daily (after the morning weigh-in)
  workflow_dispatch:
    inputs:
      days:
        description: "How many past days to scan for weigh-ins"
        default: "7"
      diagnose:
        description: "Probe endpoints and print shapes only (no sync)"
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r tools/zepp-sync/requirements.txt
      - run: python tools/zepp-sync/sync.py
        env:
          ZEPP_EMAIL: ${{ secrets.ZEPP_EMAIL }}
          ZEPP_PASSWORD: ${{ secrets.ZEPP_PASSWORD }}
          ZEPP_HOST: ${{ vars.ZEPP_HOST }}
          ITACA_URL: ${{ secrets.ITACA_URL }}
          ITACA_API_TOKEN: ${{ secrets.ITACA_API_TOKEN }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          DIAGNOSE: ${{ github.event.inputs.diagnose || 'false' }}
          # 'zepp' only: Xiaomi's risk control (70016) blocks the Mi OAuth from datacenter IPs,
          # and hammering it daily could flag the Mi account. The scale flows in via the Apple
          # Health shortcut instead; this cron remains for the day Zepp's cloud has data.
          ZEPP_AUTH: ${{ vars.ZEPP_AUTH || 'zepp' }}
